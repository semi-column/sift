name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and signs with the real key, uploads the APK as an artifact, creates no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches versionName
        if: github.event_name == 'push'
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIFT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        env:
          SIFT_KEYSTORE: ${{ runner.temp }}/release.jks
          SIFT_KEYSTORE_PASSWORD: ${{ secrets.SIFT_KEYSTORE_PASSWORD }}
          SIFT_KEY_ALIAS: ${{ secrets.SIFT_KEY_ALIAS }}
          SIFT_KEY_PASSWORD: ${{ secrets.SIFT_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Verify signature and collect files
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Sift-$GITHUB_REF_NAME.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload dry-run APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sift-release-dry-run
          path: dist/
          retention-days: 3

      # A draft, so every release is reviewed by hand before anyone can download it.
      - name: Create draft GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Sift $GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
